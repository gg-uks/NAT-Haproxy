global
log 127.0.0.1 local0
maxconn 4000

defaults
log global
mode http
option httplog
option dontlognull
timeout connect 5s
timeout client 30s
timeout server 30s

frontend web_front
bind 192.168.56.101:80

# URL의 algo 값에 따라 로드밸런싱 방식 선택
acl algo_rr       url_param(algo) -m str roundrobin
acl algo_weighted url_param(algo) -m str weighted
acl algo_least    url_param(algo) -m str leastconn
acl algo_source   url_param(algo) -m str source

use_backend be_weighted if algo_weighted
use_backend be_leastconn if algo_least
use_backend be_source if algo_source
use_backend be_roundrobin if algo_rr

default_backend be_roundrobin

backend be_roundrobin
balance roundrobin
option httpchk GET /
server web1 192.168.56.103:80 check
server web2 192.168.56.104:80 check
server web3 192.168.56.105:80 check

backend be_weighted
balance roundrobin
option httpchk GET /
server web1 192.168.0.103:80 check weight 5
server web2 192.168.0.104:80 check weight 3
server web3 192.168.0.105:80 check weight 1

backend be_leastconn
balance leastconn
option httpchk GET /
server web1 192.168.0.103:80 check
server web2 192.168.0.104:80 check
server web3 192.168.0.105:80 check

backend be_source
balance source
option httpchk GET /
server web1 192.168.0.103:80 check
server web2 192.168.0.104:80 check
server web3 192.168.0.105:80 check

listen stats
bind *:9000
stats enable
stats uri /
stats refresh 5s
stats show-node
stats auth admin:1234
